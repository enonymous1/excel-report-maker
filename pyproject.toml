[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-report-maker"
version = "2.0.0"
description = "Generate formatted Excel workbooks from JSON templates and data: compliance checklists and evaluation matrices, via CLI or a Streamlit UI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "enonymous1" }]
keywords = ["excel", "xlsxwriter", "xlsx", "reports", "checklist", "cli", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "XlsxWriter>=3.2",
    "json5>=0.9.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.40",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "openpyxl>=3.1",
]

[project.scripts]
excel-report-maker = "excel_report_maker.cli:main"

[project.urls]
Homepage = "https://github.com/enonymous1/excel-report-maker"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
excel_report_maker = ["templates/*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = false
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
